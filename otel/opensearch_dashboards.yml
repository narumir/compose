server.host: "0.0.0.0"
server.port: 5601

opensearch.hosts: ["http://opensearch:9200"]
# username/password are injected via container environment variables:
# - OPENSEARCH_USERNAME
# - OPENSEARCH_PASSWORD
opensearch.requestTimeout: 30000

# Security
opensearch_security.multitenancy.enabled: false
opensearch_security.readonly_mode.roles: ["kibana_read_only"]
opensearch_security.cookie.secure: false
savedObjects.permission.enabled: true
opensearchDashboards.dashboardAdmin.users: ["admin"]

# New OpenSearch Dashboards Experience (workspace + data_source + explore)
# ref: https://github.com/opensearch-project/OpenSearch-Dashboards/blob/main/config/opensearch_dashboards.yml
data_source.enabled: true
data_source.hideLocalCluster: true
data_source.ssl.verificationMode: none
workspace.enabled: true
explore.enabled: true
explore.discoverTraces.enabled: true
explore.discoverMetrics.enabled: true
 